# Runs the tests, fetches fresh data from all sources, and publishes the app to GitHub Pages.
# Triggers: every push, every 2 hours (schedule), or manually ("Run workflow" button).
name: Update data & deploy

on:
  push:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Fetch data from sources
        run: npm run fetch
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    # Only the default branch publishes (scheduled/manual runs always use it).
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
